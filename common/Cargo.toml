[package]
name = "gyroflow-plugin-base"
version = "0.1.0"
edition = "2024"
authors = ["Adrian <adrian.eddy@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Gyroflow plugin base"

[dependencies]
log = "0.4"
itertools = "0.15"
lru = "0.18"
gyroflow-core = { git = "https://github.com/ijigen/gyroflow.git", default-features = false, rev = "f1f09194", features = ["bundle-lens-profiles", "use-opencl", "cache-gyro-metadata"] }
#gyroflow-core = { path = "../../gyroflow/src/core", default-features = false, features = ["bundle-lens-profiles", "use-opencl", "cache-gyro-metadata"] }
log-panics = "2.1"
serde = "1"
serde_json = "1"
ureq = "3.4"
prost = "0.14"
crc32fast = "1.5"
ciborium = "0.2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
parking_lot = "0.12"
lazy_static = "1.5.0"
fastrand = "2.5"
simplelog = "0.12.2"
win_dbg_logger = "0.1"
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
oslog = "0.2"
